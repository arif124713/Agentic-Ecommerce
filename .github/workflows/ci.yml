name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (spec §22 — secret-scanning gate)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (ruff · mypy · pytest+coverage · alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Matches the shape of `.env.example` — Settings (pydantic-settings) reads these directly,
      # so no extra config file is needed for CI. Root/root against the service container below.
      MYSQL_USER: root
      mysql_password: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      APP_ENV: test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app scripts tests

      - name: mypy
        # A hard gate now (see done.MD for the writeup) — was informational for a while after this
        # workflow first stood up, since the first-ever run surfaced 46 pre-existing errors: real
        # bugs (missing None-checks that could crash on a genuinely-empty lookup, a float leaking
        # into a Decimal-typed rating column) alongside the known ORM-object-vs-Pydantic-schema
        # duck-typing mypy can't see through `from_attributes=True` (fixed via explicit
        # `.model_validate()` calls instead of passing raw ORM objects to schema constructors).
        run: mypy app --ignore-missing-imports

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && exit 0
            sleep 2
          done
          echo "MySQL never became ready" >&2
          exit 1

      - name: pip-audit (spec §22/§25 — dependency vulnerability gate, 0 high/critical per §2.3)
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt

      - name: Pytest (spec §24 — the suite manages its own blackcart_test database)
        run: pytest tests/ -q --cov=app --cov-report=term-missing

      - name: Alembic upgrade -> downgrade -> upgrade -> check (spec §8.4's migration gate)
        env:
          MYSQL_DB: blackcart_ci
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS blackcart_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (tsc · oxlint · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (spec §22/§25 — dependency vulnerability gate, 0 high/critical per §2.3)
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
